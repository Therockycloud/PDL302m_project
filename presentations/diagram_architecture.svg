<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" font-family="'Plus Jakarta Sans', sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#71717a"/>
    </marker>
  </defs>
  <style>
    .box{fill:#ffffff;stroke:#e4e4e7;stroke-width:1.5;}
    .acc{fill:#f0fdf4;stroke:#15803d;stroke-width:2;}
    .grp{fill:#f8fafc;stroke:#e4e4e7;stroke-width:1.5;stroke-dasharray:5 4;}
    .t{fill:#18181b;font-size:14px;font-weight:700;}
    .s{fill:#71717a;font-size:11px;}
    .ta{fill:#15803d;font-size:14px;font-weight:700;}
    .lbl{fill:#a1a1aa;font-size:11px;font-weight:700;letter-spacing:1px;}
    .flow{stroke:#71717a;stroke-width:1.6;fill:none;}
    .mono{font-family:'JetBrains Mono',monospace;fill:#71717a;font-size:10px;}
  </style>

  <text x="20" y="30" class="t" font-size="17">Kiến trúc hệ thống</text>

  <!-- camera -->
  <rect x="20" y="140" width="120" height="64" rx="10" class="box"/>
  <text x="80" y="168" text-anchor="middle" class="t">Camera</text>
  <text x="80" y="186" text-anchor="middle" class="s">CCTV / webcam</text>

  <!-- fastapi -->
  <rect x="180" y="140" width="120" height="64" rx="10" class="box"/>
  <text x="240" y="168" text-anchor="middle" class="t">FastAPI</text>
  <text x="240" y="186" text-anchor="middle" class="mono">:8000</text>

  <!-- models group -->
  <rect x="340" y="64" width="220" height="216" rx="12" class="grp"/>
  <text x="356" y="86" class="lbl">SUY LUẬN (CPU · ONNX)</text>
  <rect x="356" y="100" width="188" height="50" rx="8" class="box"/>
  <text x="450" y="122" text-anchor="middle" class="t" font-size="13">YOLOv8n → PaddleOCR</text>
  <text x="450" y="138" text-anchor="middle" class="s">biển số (khoá chính)</text>
  <rect x="356" y="162" width="188" height="46" rx="8" class="box"/>
  <text x="450" y="182" text-anchor="middle" class="t" font-size="13">MobileNetV3 màu</text>
  <text x="450" y="198" text-anchor="middle" class="s">cảnh báo phụ</text>
  <rect x="356" y="220" width="188" height="44" rx="8" class="box"/>
  <text x="450" y="240" text-anchor="middle" class="t" font-size="13">Gate "đã đỗ" + vote</text>
  <text x="450" y="255" text-anchor="middle" class="s">1 lần/xe</text>

  <!-- matcher -->
  <rect x="600" y="140" width="120" height="64" rx="10" class="box"/>
  <text x="660" y="164" text-anchor="middle" class="t" font-size="13">Matcher</text>
  <text x="660" y="182" text-anchor="middle" class="mono">database.csv</text>

  <!-- dashboard -->
  <rect x="760" y="140" width="110" height="64" rx="10" class="acc"/>
  <text x="815" y="164" text-anchor="middle" class="ta" font-size="13">Streamlit</text>
  <text x="815" y="182" text-anchor="middle" class="s">dashboard</text>

  <!-- arrows -->
  <line x1="140" y1="172" x2="176" y2="172" class="flow" marker-end="url(#arr)"/>
  <line x1="300" y1="172" x2="336" y2="172" class="flow" marker-end="url(#arr)"/>
  <line x1="560" y1="172" x2="596" y2="172" class="flow" marker-end="url(#arr)"/>
  <line x1="720" y1="172" x2="756" y2="172" class="flow" marker-end="url(#arr)"/>
</svg>
