<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="'Plus Jakarta Sans', sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#71717a"/>
    </marker>
  </defs>
  <style>
    .box{fill:#ffffff;stroke:#e4e4e7;stroke-width:1.5;}
    .ok{fill:#f0fdf4;stroke:#15803d;stroke-width:2;}
    .bad{fill:#fef2f2;stroke:#b91c1c;stroke-width:2;}
    .warn{fill:#fffbeb;stroke:#b45309;stroke-width:2;}
    .t{fill:#18181b;font-size:15px;font-weight:700;}
    .s{fill:#71717a;font-size:11px;}
    .tg{fill:#15803d;font-size:16px;font-weight:800;}
    .tr{fill:#b91c1c;font-size:16px;font-weight:800;}
    .tw{fill:#b45309;font-size:14px;font-weight:800;}
    .lbl{fill:#71717a;font-size:11px;font-style:italic;}
    .flow{stroke:#71717a;stroke-width:1.6;fill:none;}
  </style>

  <text x="20" y="30" class="t" font-size="17">Logic quyết định — plate-primary</text>

  <!-- input -->
  <rect x="40" y="60" width="170" height="60" rx="10" class="box"/>
  <text x="125" y="86" text-anchor="middle" class="t" font-size="14">Biển số + màu xe</text>
  <text x="125" y="104" text-anchor="middle" class="s">từ pipeline</text>

  <!-- q1: plate in DB -->
  <rect x="290" y="55" width="180" height="70" rx="10" class="box"/>
  <text x="380" y="84" text-anchor="middle" class="t" font-size="14">Biển có trong CSDL?</text>
  <text x="380" y="104" text-anchor="middle" class="s">tra cứu database.csv</text>

  <!-- UNREGISTERED -->
  <rect x="550" y="55" width="180" height="70" rx="10" class="bad"/>
  <text x="640" y="88" text-anchor="middle" class="tr">UNREGISTERED</text>
  <text x="640" y="108" text-anchor="middle" class="s">khoá barrier · báo động</text>

  <!-- q2: colour match -->
  <rect x="290" y="200" width="180" height="70" rx="10" class="box"/>
  <text x="380" y="229" text-anchor="middle" class="t" font-size="14">Màu có khớp?</text>
  <text x="380" y="249" text-anchor="middle" class="s">đối chiếu bản ghi</text>

  <!-- AUTHORIZED -->
  <rect x="550" y="195" width="180" height="62" rx="10" class="ok"/>
  <text x="640" y="222" text-anchor="middle" class="tg">AUTHORIZED</text>
  <text x="640" y="241" text-anchor="middle" class="s">mở barrier</text>

  <!-- soft warning -->
  <rect x="290" y="330" width="440" height="62" rx="10" class="warn"/>
  <text x="510" y="357" text-anchor="middle" class="tw">AUTHORIZED + cảnh báo mềm</text>
  <text x="510" y="376" text-anchor="middle" class="s">vẫn mở barrier — màu lệch chỉ ghi cảnh báo, không từ chối cứng</text>

  <!-- arrows -->
  <line x1="210" y1="90" x2="286" y2="90" class="flow" marker-end="url(#arr)"/>
  <line x1="470" y1="90" x2="546" y2="90" class="flow" marker-end="url(#arr)"/>
  <text x="500" y="80" class="lbl">không</text>
  <!-- q1 -> q2 (có) -->
  <path d="M380,125 L380,196" class="flow" marker-end="url(#arr)"/>
  <text x="388" y="160" class="lbl">có</text>
  <!-- q2 -> authorized (khớp) -->
  <line x1="470" y1="232" x2="546" y2="226" class="flow" marker-end="url(#arr)"/>
  <text x="495" y="218" class="lbl">khớp</text>
  <!-- q2 -> soft warn (lệch) -->
  <path d="M380,270 L380,326" class="flow" marker-end="url(#arr)"/>
  <text x="388" y="302" class="lbl">lệch</text>
</svg>
