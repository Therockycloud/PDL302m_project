# System Paths Configuration
paths:
  database_csv: "main/data/database.csv"
  raw_data_dir: "main/data/raw"
  processed_data_dir: "main/data/processed"
  model_save_dir: "main/data/models"

# YOLOv8 Plate Detector Parameters
detector:
  model_name: "yolov8n.onnx"
  conf_threshold: 0.25
  crop_padding: 0.05  # Padding around the cropped plate (5%)

# OCR Reader Parameters
ocr:
  languages: ["en"]  # English is standard for alphanumeric plates
  gpu: false         # Toggle CPU vs GPU for OCR
  engine: "ppocr"   # ppocr | easyocr  (PaddleOCR won Benchmark C: 81% vs 0% exact-match)

# Keras EfficientNet-B0 Brand Classifier Parameters
brand_classifier:
  input_shape: [224, 224, 3]
  batch_size: 32
  initial_epochs: 10
  fine_tune_epochs: 10
  learning_rate: 0.0001
  fine_tune_learning_rate: 0.00001
  dropout_rate: 0.5
  num_classes: 8
  classes:
    - Toyota
    - Hyundai
    - Kia
    - Mazda
    - Honda
    - VinFast
    - Ford
    - Mitsubishi

# Keras MobileNetV3-Small Color Classifier Parameters
color_classifier:
  input_shape: [224, 224, 3]
  batch_size: 32
  epochs: 10
  learning_rate: 0.0001
  num_classes: 8
  classes:
    - White
    - Black
    - Grey
    - Silver
    - Red
    - Blue
    - Brown
    - Yellow

# Two-stage parking pipeline
#
# Camera-angle calibration (no code changes needed):
#   The trigger fires when the largest vehicle is (a) inside `roi`, (b) at least
#   `min_area_ratio` of the frame, and (c) still for `stable_frames` samples.
#   These are tuned for a camera mounted IN THE PARKING SLOT CORNER looking OUT,
#   where a reverse-parking car backs toward the camera (rear plate facing it)
#   and grows large + low in the frame before stopping.
#
#   To calibrate for a new camera/clip, run:
#     python scripts/calibrate_roi.py --source <your_clip.mp4> --frame-frac 0.7
#   and adjust `roi` (x0 y0 x1 y1, normalized 0..1) and `min_area_ratio` until
#   the parked car shows GATE (green). Example corner-out preset:
#     roi: [0.15, 0.30, 0.85, 1.0]   # wider, taller catch zone for a close car
#     min_area_ratio: 0.20           # car fills more of the frame when backed in
pipeline:
  frame_sample_interval: 5
  collect_frames: 5
  trigger:
    min_area_ratio: 0.15
    stable_frames: 5
    move_eps: 0.02
    roi: null   # null => default middle-bottom ROI (0.2,0.4,0.8,1.0)

# Dedicated license-plate detector (stage 2)
plate_detector:
  model_name: "plate_yolov8n.onnx"
  conf_threshold: 0.3
