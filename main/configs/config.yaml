# System Paths Configuration
paths:
  database_csv: "main/data/database.csv"
  raw_data_dir: "main/data/raw"
  processed_data_dir: "main/data/processed"
  model_save_dir: "main/data/models"

# YOLOv8 Plate Detector Parameters
detector:
  model_name: "yolov8n.onnx"
  conf_threshold: 0.25
  crop_padding: 0.05  # Padding around the cropped plate (5%)

# OCR Reader Parameters
ocr:
  languages: ["en"]  # English is standard for alphanumeric plates
  gpu: false         # Toggle CPU vs GPU for OCR
  engine: "ppocr"   # ppocr | easyocr  (PaddleOCR won Benchmark C: 81% vs 0% exact-match)

# Keras EfficientNet-B0 Brand Classifier Parameters
brand_classifier:
  input_shape: [224, 224, 3]
  batch_size: 32
  initial_epochs: 10
  fine_tune_epochs: 15
  learning_rate: 0.001        # frozen-head LR; 1e-4 was too low (head never converged before EarlyStopping)
  fine_tune_learning_rate: 0.0001   # unfreeze top half of backbone; 1e-5 was too low to move the needle
  dropout_rate: 0.5
  num_classes: 8
  classes:
    - Toyota
    - Hyundai
    - Kia
    - Mazda
    - Honda
    - VinFast
    - Ford
    - Mitsubishi

# Keras MobileNetV3-Small Color Classifier Parameters
color_classifier:
  input_shape: [224, 224, 3]
  batch_size: 32
  epochs: 10
  learning_rate: 0.001        # frozen-head LR; 1e-4 was too low (head never converged before EarlyStopping)
  fine_tune_epochs: 15
  fine_tune_learning_rate: 0.0001   # fine-tune lifted held-out test 48.3% -> 54.2%
  num_classes: 8
  # Runtime serves color_classifier.keras out-of-process (TF can't share the
  # dashboard process with PaddleOCR). Optional: path to a python that has
  # TensorFlow; defaults to env DPL_TRAIN_PYTHON, then the dpl-train env.
  worker_python: null
  classes:
    - White
    - Black
    - Grey
    - Silver
    - Red
    - Blue
    - Brown
    - Yellow

# Two-stage parking pipeline
#
# Camera-angle calibration (no code changes needed):
#   The trigger fires when the largest vehicle is (a) inside `roi` and (b) at
#   least `min_area_ratio` of the frame, persisted for `min_persist_frames`
#   consecutive samples. These are tuned for a camera mounted IN THE PARKING
#   SLOT CORNER looking OUT, where a reverse-parking car backs toward the
#   camera (rear plate facing it) and grows large + low in the frame.
#
#   WS-1 finding (probe on test/sample_parking.mp4): the plate is only
#   readable while the car is APPROACHING (area ratio ~0.16-0.8, frames
#   492-534) — once fully parked (area >0.9, peak frame ~666) the plate is
#   too close/occluded and OCR goes blind. So the decision window opens
#   during persistence in ROI, NOT after the vehicle stops moving
#   (`stable_frames`/`move_eps` are kept only for backward compatibility with
#   older callers/tests; they no longer gate readiness).
#
#   To calibrate for a new camera/clip, run:
#     python scripts/calibrate_roi.py --source <your_clip.mp4> --frame-frac 0.7
#   and adjust `roi` (x0 y0 x1 y1, normalized 0..1) and `min_area_ratio` until
#   the parked car shows GATE (green). Example corner-out preset:
#     roi: [0.15, 0.30, 0.85, 1.0]   # wider, taller catch zone for a close car
#     min_area_ratio: 0.20           # car fills more of the frame when backed in
pipeline:
  frame_sample_interval: 5
  collect_frames: 5
  trigger:
    min_area_ratio: 0.15   # default demo clip (test/sample_parking.mp4 = real reverse-park footage) peaks ~0.99, fires the full pipeline at this calibrated value
    stable_frames: 5       # kept for backward compatibility; no longer gates readiness (see WS-1 note above)
    move_eps: 0.02         # kept for backward compatibility; no longer gates readiness (see WS-1 note above)
    roi: [0.35, 0.30, 0.65, 1.0]   # own-slot ROI for the default demo clip; calibrate per camera
    approach_min_area: 0.15        # area ratio at which the reverse-approach window opens
    min_persist_frames: 3          # consecutive in-ROI samples required before READY_TO_DECIDE
  lock:
    capture_conf: 0.50   # minimum plate-detect conf to attempt OCR on a frame
    lock_conf: 0.60       # minimum OCR conf for a read to count toward locking
    lock_repeat: 2        # number of matching high-conf reads required to lock the plate
    late_area: 0.85       # area ratio past which an un-locked plate is logged as "read late"

# Dedicated license-plate detector (stage 2)
plate_detector:
  model_name: "plate_yolov8n.onnx"
  conf_threshold: 0.15

# WS-2: verify_vehicle colour cross-check tuning (cuts false-alarm rate from
# the measured 14.5% baseline -- see docs/benchmarks/security_eval.md).
# neutral_colors: colours treated as equivalent to each other (the colour
#   classifier's known confusable cluster, Report 3 §5.1) so a mismatch
#   between them does not raise a colour warning.
# color_warn_conf: minimum colour-classification confidence required before
#   a genuine cross-cluster colour mismatch raises a warning; below this the
#   mismatch is too likely to be classifier noise to flag.
decision:
  color_warn_conf: 0.40
  neutral_colors: [Black, Grey, Silver, White]
